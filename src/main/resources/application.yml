spring:
    cloud:
        gateway:
            server:
                webflux:
                    routes:          
                    - id: msvc-products
                      uri: lb://msvc-products
                      predicates:
                      - Path=/api/products/**
                      #- Header=token, 12345    # Debe incluir un header llamado token con valor 12345
                      #- Header=token, \d+      # (Con expresion regular)
                      #- Method=GET, POST       # Debe tener metodo GET o POST
                      #- Query=color, verde     # En los parametros de entrada debe tenes uno de nombre color e igual a verde
                      filters:
                      - StripPrefix=2
                      - name: SampleCookie
                        args:
                            message: Hola mi mensaje personalizado para producto
                            name: user
                            value: Daniel
                    - id: msvc-itemsv2
                      uri: lb://msvc-itemsv2
                      predicates:
                      - Path=/api/items/**
                      filters:
                      - StripPrefix=2
                      - AddRequestHeader=token-request, abcdef
                      - AddResponseHeader=token-response, 123456
                      - AddRequestParameter=name, Daniel             